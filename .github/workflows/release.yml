name: Release

on:
  push:
    tags:
      - 'V*.*.*'  # Trigger on version tags like V1.0.0, V2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
      attestations: write

    environment: nuget
    
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Required for MinVer
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Run tests
      run: dotnet test --configuration Release --no-build --verbosity normal
    
    - name: Pack NuGet package
      run: dotnet pack CDS.FluentHtmlReports/CDS.FluentHtmlReports.csproj --configuration Release --no-build --output ./artifacts
    
    - name: Get version from tag
      id: get_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/V}
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Releasing version: $VERSION"

    - name: Generate SBOM
      run: |
        dotnet tool install --global CycloneDX
        dotnet-CycloneDX CDS.FluentHtmlReports/CDS.FluentHtmlReports.csproj -o ./artifacts -F json -sv ${{ steps.get_version.outputs.VERSION }}

    # actions/attest-build-provenance and actions/attest-sbom are both now thin wrappers over
    # actions/attest (which auto-detects provenance vs. SBOM mode from whether sbom-path is
    # set) - attest-sbom specifically logs a runtime deprecation warning, so both steps below
    # use the unified action directly instead.
    - name: Attest build provenance
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ./artifacts/*.nupkg

    - name: Attest SBOM
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: ./artifacts/*.nupkg
        sbom-path: ./artifacts/bom.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./artifacts/*.nupkg
          ./artifacts/bom.json
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Authenticate with NuGet (Trusted Publishing)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: nuget-auth
      with:
        user: ${{ secrets.NUGET_USER }}
    
    - name: Push to NuGet.org
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        dotnet nuget push ./artifacts/CDS.FluentHtmlReports.*.nupkg \
          --api-key ${{ steps.nuget-auth.outputs.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
