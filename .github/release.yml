# Groups the notes generated for each GitHub Release (release.yml workflow,
# generate_release_notes: true). A PR lands in the first category it matches.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Fixes
      labels:
        - bug
    - title: Features
      labels:
        - enhancement
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
